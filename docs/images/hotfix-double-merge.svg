<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680" width="1180" height="680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="f-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1180" height="680" fill="#ffffff"/>

  <text x="40" y="42" font-size="21" font-weight="700" fill="#111827">hotfix 的两条回流线：为什么它必须合两次</text>
  <text x="40" y="66" font-size="12.5" fill="#6b7280">这是整套练习里最容易出错、也最像真实工作的一环。漏掉第二条线，下次发版就会把线上的修复冲掉。</text>

  <!-- develop -->
  <line x1="90" y1="120" x2="1090" y2="120" stroke="#2563eb" stroke-width="3"/>
  <circle cx="760" cy="120" r="6" fill="#2563eb"/>
  <text x="90" y="104" font-size="12.5" font-weight="700" fill="#2563eb">develop</text>
  <text x="152" y="104" font-size="10.5" fill="#6b7280">已经往前跑了很多提交，但这些代码都还没上线</text>

  <!-- main -->
  <line x1="90" y1="270" x2="1090" y2="270" stroke="#1f2937" stroke-width="4"/>
  <text x="90" y="298" font-size="12.5" font-weight="700" fill="#1f2937">main</text>
  <text x="132" y="298" font-size="10.5" fill="#6b7280">线上正在跑的版本</text>

  <!-- hotfix 切出与合并 -->
  <path d="M 300,270 Q 330,380 400,380" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="400" y1="380" x2="520" y2="380" stroke="#dc2626" stroke-width="3"/>
  <path d="M 520,380 Q 575,380 598,276" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#f-red)"/>
  <circle cx="300" cy="270" r="6" fill="#dc2626"/>
  <circle cx="400" cy="380" r="6" fill="#dc2626"/>
  <circle cx="520" cy="380" r="6" fill="#dc2626"/>
  <text x="398" y="366" font-size="11.5" font-weight="700" fill="#dc2626">hotfix/fix-null-pointer</text>
  <text x="398" y="404" font-size="10.5" fill="#6b7280">只改这一个 bug，其他一概不碰</text>
  <text x="270" y="248" font-size="10.5" font-weight="600" fill="#dc2626">① 从线上版本切出</text>
  <text x="556" y="240" font-size="10.5" font-weight="600" fill="#dc2626">② 合回 main，立刻发布</text>

  <!-- 回流 develop -->
  <path d="M 520,380 Q 700,420 758,132" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#f-red)"/>
  <text x="772" y="196" font-size="11" font-weight="700" fill="#dc2626">③ 再合回 develop</text>

  <rect x="800" y="392" width="336" height="72" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="816" y="414" font-size="11.5" font-weight="700" fill="#b91c1c">这一步最常被忘掉</text>
  <text x="816" y="434" font-size="10.5" fill="#991b1b">忘了它 → develop 上还是旧代码</text>
  <text x="816" y="452" font-size="10.5" fill="#991b1b">→ 下次发版用 develop 覆盖 main，修复复活</text>
  <path d="M 800,428 L 668,340" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 卡片 1 -->
  <rect x="40" y="492" width="350" height="172" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="58" y="518" font-size="12.5" font-weight="700" fill="#b91c1c">反例①　只合 main</text>
  <text x="58" y="544" font-size="11" fill="#7f1d1d">线上立刻好了，看着没问题。</text>
  <text x="58" y="564" font-size="11" fill="#7f1d1d">但 develop 上那段代码依然是错的。</text>
  <text x="58" y="592" font-size="11" font-weight="600" fill="#b91c1c">下一次 release 发版时：</text>
  <text x="58" y="612" font-size="11" fill="#7f1d1d">release 从 develop 切出</text>
  <text x="58" y="630" font-size="11" fill="#7f1d1d">→ 用旧代码覆盖 main → bug 原地复活</text>
  <text x="58" y="652" font-size="10.5" fill="#991b1b">真实团队管这叫「回归（regression）」</text>

  <!-- 卡片 2 -->
  <rect x="410" y="492" width="350" height="172" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="428" y="518" font-size="12.5" font-weight="700" fill="#92400e">反例②　拿 cherry-pick 代替</text>
  <text x="428" y="544" font-size="11" fill="#78350f">嫌合并麻烦，挑单个提交过去：</text>
  <text x="428" y="566" font-size="10.5" font-family="Consolas,Menlo,monospace" fill="#92400e">git cherry-pick 73c4f05</text>
  <text x="428" y="590" font-size="11" fill="#78350f">它只复制内容，不记录「已合并」。</text>
  <text x="428" y="610" font-size="11" fill="#78350f">两边各留一份内容相同、哈希不同的提交，</text>
  <text x="428" y="630" font-size="11" fill="#78350f">以后再合并会一直犯迷糊。</text>
  <text x="428" y="652" font-size="10.5" font-weight="600" fill="#b45309">hotfix 要 merge，不是 pick</text>

  <!-- 卡片 3 -->
  <rect x="780" y="492" width="356" height="172" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="798" y="518" font-size="12.5" font-weight="700" fill="#075985">release 和 hotfix 差在哪</text>
  <text x="798" y="546" font-size="11" fill="#0c4a6e">切出点　release 从 develop ／ hotfix 从 main</text>
  <text x="798" y="568" font-size="11" fill="#0c4a6e">改什么　release 冻结功能只修 bug</text>
  <text x="798" y="588" font-size="11" fill="#0c4a6e">　　　　hotfix 只修线上这一个紧急问题</text>
  <text x="798" y="610" font-size="11" fill="#0c4a6e">合并去向　两者一样，都要合两次</text>
  <text x="798" y="636" font-size="11" font-weight="600" fill="#075985">判断口诀：除了 main，谁还缺这段代码？</text>
  <text x="798" y="654" font-size="10.5" fill="#0369a1">答案是 develop 缺 → 那就必须再合一次。</text>
</svg>
